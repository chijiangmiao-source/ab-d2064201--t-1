services:
  web:
    build: .
    image: t1-audit-station:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      AUDIT_FILE: /data/audits.json
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Executable acceptance entrypoint:
  #   docker compose run --rm verify
  # Runs build check, the protocol/audit/http test suite and the API/HTTP
  # smoke test, then exits reporting the acceptance result via exit code.
  verify:
    build: .
    image: t1-audit-station:latest
    environment:
      PORT: "18080"
      HOST: "127.0.0.1"
      AUDIT_FILE: /tmp/audits.verify.json
    command: ["bash", "scripts/verify.sh"]
    depends_on:
      web:
        condition: service_healthy
    # The smoke portion starts its own server bound to 127.0.0.1:18080, so
    # no published port is needed; the verdict is carried by the exit code.
    network_mode: host

volumes:
  audit-data:
